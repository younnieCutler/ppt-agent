name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Windows runs the full suite: font preflight reads the Windows font registry (src/fonts.ts), so
  # every render/OOXML/template test needs it. Tests that additionally require Microsoft PowerPoint
  # itself probe for the COM object and skip when it is absent — a CI runner has Windows but no
  # Office, and that is a missing application, not a product regression.
  test:
    name: test (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Linux cannot run the suite — font preflight deliberately supports Windows and macOS only, and
  # a deck must never render with an unverified typeface. This job still catches type and build
  # portability breaks, which is what it is honestly able to check.
  portability:
    name: typecheck + build (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
