name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # This PR makes measurement and regression a product concern, so "166 tests pass" cannot stay a
  # local claim. Ubuntu is the fast required check; Windows additionally exercises the render,
  # font-preflight, and PowerPoint COM paths that are skipped elsewhere.
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
